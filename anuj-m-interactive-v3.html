<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anuj Marudachalam | Enter the Data Center</title>
<meta name="description" content="Interactive data-center portfolio of Anuj Marudachalam — HPC Engineer. Roam the racks: skills, experience, projects, events, education and contact as server racks and KVM consoles.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@400;500;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#04070c;--panel:#0a1119;--panel2:#0d1620;--line:rgba(110,170,215,.16);--line2:rgba(110,170,215,.3);
--cyan:#4fd8ff;--violet:#9d8bff;--amber:#ffb454;--green:#5ce8a8;--red:#ff6b6b;
--txt:#eef5fb;--txt2:#9fb2c6;--mut:#5b6f83;
--mono:'JetBrains Mono',monospace;--disp:'Orbitron',sans-serif;--body:'Space Grotesk',sans-serif;
--ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);background:var(--bg);color:var(--txt);overflow:hidden}
::selection{background:var(--cyan);color:#04121a}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#22384a;border-radius:4px}
button{font-family:inherit}
/* ============ ENTRY SEQUENCE ============ */
#entry{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .8s var(--ease),visibility .8s}
#entry.done{opacity:0;visibility:hidden}
.entrybox{width:min(620px,92vw);font:.82rem/1.9 var(--mono);color:var(--txt2)}
.entrybox .etitle{font:900 clamp(1.6rem,4.5vw,2.6rem)/1.2 var(--disp);letter-spacing:.1em;color:var(--cyan);text-shadow:0 0 26px rgba(79,216,255,.5);margin-bottom:1.2rem}
.entrybox .etitle small{display:block;font:500 .8rem var(--mono);color:var(--mut);letter-spacing:.35em;margin-top:.5rem;text-transform:uppercase}
#bootlog{white-space:pre-wrap;min-height:180px}
#bootlog .ok{color:var(--green)}#bootlog .info{color:var(--txt2)}#bootlog .hi{color:var(--cyan)}#bootlog .warn{color:var(--amber)}
.badge{display:inline-flex;align-items:center;gap:.6rem;border:1px solid var(--line2);border-radius:8px;padding:.6rem 1.1rem;margin-top:1.2rem;background:var(--panel);opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
.badge.show{opacity:1;transform:none}
.badge i{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red)}
.badge.grant i{background:var(--green);box-shadow:0 0 12px var(--green)}
.badge span{letter-spacing:.12em}
.door{position:fixed;inset:0;z-index:290;pointer-events:none}
.door .leaf{position:absolute;top:0;bottom:0;width:51%;background:linear-gradient(180deg,#0a1420,#050a10);border:1px solid var(--line);transition:transform 1.2s var(--ease)}
.door .l{left:0;border-radius:0 12px 12px 0}
.door .r{right:0;border-radius:12px 0 0 12px}
.door.open .l{transform:translateX(-102%)}
.door.open .r{transform:translateX(102%)}
/* ============ AMBIENT BACKGROUND ============ */
#floor{position:fixed;inset:0;z-index:0;pointer-events:none;
background:
radial-gradient(900px 380px at 50% 116%,rgba(79,216,255,.15),transparent 70%),
radial-gradient(1500px 700px at 50% -10%,rgba(157,139,255,.09),transparent 65%),
linear-gradient(180deg,#03060b 0%,#05090f 55%,#071019 100%)}
/* distant rack rows deep in the aisle */
#floor::after{content:'';position:absolute;left:0;right:0;top:0;height:66vh;pointer-events:none;
background:
repeating-linear-gradient(90deg,rgba(9,15,23,.92) 0 78px,transparent 78px 148px),
repeating-linear-gradient(90deg,rgba(79,216,255,.10) 0 2px,transparent 2px 148px),
repeating-linear-gradient(90deg,rgba(92,232,168,.14) 0 2px,transparent 2px 70px);
mask-image:linear-gradient(180deg,transparent 2%,#000 26%,#000 70%,transparent 98%);-webkit-mask-image:linear-gradient(180deg,transparent 2%,#000 26%,#000 70%,transparent 98%);
animation:dcblink 8s ease-in-out infinite}
@keyframes dcblink{0%,100%{opacity:.4}50%{opacity:.62}}
#ceil{position:fixed;left:0;right:0;top:0;height:120px;z-index:0;pointer-events:none;
background:radial-gradient(700px 130px at 50% -30px,rgba(157,139,255,.10),transparent 70%)}
/* overhead cable tray + lights */
#ceil::after{content:'';position:absolute;left:0;right:0;top:0;height:44px;
background:
repeating-linear-gradient(90deg,rgba(110,170,215,.16) 0 9px,transparent 9px 40px),
linear-gradient(180deg,rgba(110,170,215,.12),transparent);
border-bottom:1px solid rgba(110,170,215,.14)}
#dust{position:fixed;inset:0;z-index:1;pointer-events:none}
/* ============ HUD ============ */
.hud{position:fixed;z-index:60;font-family:var(--mono)}
#top{top:0;left:0;right:0;display:flex;align-items:center;gap:1rem;padding:.7rem 1.2rem;background:linear-gradient(180deg,rgba(4,7,12,.92),transparent);border-bottom:1px solid var(--line)}
#top .id{display:flex;align-items:center;gap:.7rem;font:700 1.05rem var(--disp);letter-spacing:.14em;color:var(--cyan);text-shadow:0 0 18px rgba(79,216,255,.45)}
#top .id i{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
#top .meta{margin-left:auto;display:flex;gap:1.4rem;font-size:.7rem;color:var(--mut);letter-spacing:.08em}
#top .meta b{color:var(--txt2);font-weight:500}
#top .meta .v{color:var(--cyan)}
#bottom{bottom:0;left:0;right:0;display:flex;align-items:center;gap:1.2rem;padding:.7rem 1.2rem;background:linear-gradient(0deg,rgba(4,7,12,.92),transparent);font-size:.7rem;color:var(--mut);letter-spacing:.1em}
#bottom kbd{border:1px solid var(--line2);border-radius:4px;padding:.1rem .45rem;color:var(--txt2);background:var(--panel);font-family:var(--mono)}
#bottom .hint{display:flex;gap:1.2rem;flex-wrap:wrap;align-items:center}
#net{margin-left:auto;display:flex;align-items:flex-end;gap:2px;height:18px}
#net i{width:3px;background:var(--cyan);opacity:.7;transition:height .35s ease}
#net i:nth-child(3n){background:var(--violet)}
/* minimap */
#map{position:fixed;right:1.2rem;top:64px;z-index:60;background:rgba(10,17,25,.8);border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem;font-family:var(--mono)}
#map .mt{font-size:.6rem;letter-spacing:.2em;color:var(--mut);text-transform:uppercase;margin-bottom:.5rem}
#map .row{display:flex;gap:.45rem}
#map .node{width:22px;height:30px;border:1px solid var(--line2);border-radius:3px;background:var(--panel);cursor:pointer;position:relative;transition:var(--ease) .3s}
#map .node:hover{border-color:var(--cyan)}
#map .node.on{background:rgba(79,216,255,.25);border-color:var(--cyan);box-shadow:0 0 12px rgba(79,216,255,.5)}
#map .node::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:10px;height:2px;background:var(--cyan)}
#map .node.on::after{background:#fff}
/* ============ FLOOR / RACKS ============ */
#stage{position:fixed;inset:0;z-index:10;overflow:hidden;display:flex;align-items:center}
#cam{display:flex;align-items:center;gap:6vw;padding:0 12vw;transition:transform 1s var(--ease);will-change:transform}
.rack{position:relative;width:min(280px,74vw);flex:none;border-radius:14px;cursor:pointer;
background:linear-gradient(180deg,#0c141e,#080e15);border:1px solid var(--line);
box-shadow:inset 0 0 0 1px rgba(255,255,255,.02),0 24px 60px rgba(0,0,0,.6);
transform:scale(.86);opacity:.55;transition:transform .8s var(--ease),opacity .6s,border-color .5s,box-shadow .6s}
.rack:hover{opacity:.9;border-color:var(--line2)}
.rack.on{transform:scale(1) translateY(-6px);opacity:1;border-color:rgba(79,216,255,.55);box-shadow:0 0 0 1px rgba(79,216,255,.3),0 0 44px rgba(79,216,255,.22),0 30px 70px rgba(0,0,0,.65)}
.rack .tag{position:absolute;top:-30px;left:0;right:0;text-align:center;font:600 .68rem var(--mono);letter-spacing:.3em;color:var(--mut);text-transform:uppercase;transition:color .3s}
.rack.on .tag{color:var(--cyan)}
.rack .frame{height:clamp(360px,58vh,540px);display:flex;flex-direction:column;padding:14px;gap:8px;overflow:hidden}
.rack .head{display:flex;justify-content:space-between;align-items:center;font:600 .68rem var(--mono);letter-spacing:.14em;color:var(--txt2);border-bottom:1px solid var(--line);padding-bottom:.6rem}
.rack .head .st{display:flex;gap:5px}
.rack .head .st i{width:7px;height:7px;border-radius:50%}
.rack .head .st i:nth-child(1){background:var(--red);box-shadow:0 0 8px var(--red);animation:pulse 3.5s infinite}
.rack .head .st i:nth-child(2){background:var(--amber);animation:pulse 5s infinite}
.rack .head .st i:nth-child(3){background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2.4s infinite}
.rack .units{flex:1;display:flex;flex-direction:column;gap:7px}
.unit{flex:1;background:linear-gradient(180deg,#0e1723,#0a1017);border:1px solid rgba(110,170,215,.1);border-radius:6px;display:flex;align-items:center;gap:9px;padding:0 11px;overflow:hidden}
.unit .vents{flex:none;display:flex;gap:3px}
.unit .vents i{width:2px;height:60%;background:rgba(140,190,225,.25);border-radius:1px}
.unit .name{font:.62rem var(--mono);letter-spacing:.06em;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rack.on .unit .name{color:var(--txt)}
.unit .leds{margin-left:auto;display:flex;gap:4px;align-items:center}
.unit .leds i{width:5px;height:5px;border-radius:50%;background:#1d3346}
.unit .leds i.b{background:var(--green);box-shadow:0 0 7px var(--green);animation:pulse 1.4s infinite}
.unit .leds i.a{background:var(--amber);box-shadow:0 0 7px var(--amber);animation:pulse 2.2s infinite}
.unit .leds i.c{background:var(--cyan);box-shadow:0 0 7px var(--cyan);animation:pulse 1.9s infinite}
.rack .foot{display:flex;justify-content:space-between;font:.6rem var(--mono);color:var(--mut);border-top:1px solid var(--line);padding-top:.6rem;letter-spacing:.1em}
.rack .foot b{color:var(--cyan);font-weight:500}
.rack .knob{position:absolute;right:12px;top:50%;width:7px;height:44px;transform:translateY(-50%);border-radius:3px;background:linear-gradient(180deg,#26394c,#16222e);box-shadow:inset 0 0 2px #000}
/* arrow controls */
.roam{position:fixed;top:50%;transform:translateY(-50%);z-index:60;width:52px;height:52px;border-radius:50%;border:1px solid var(--line2);background:rgba(10,17,25,.75);color:var(--cyan);font-size:1.2rem;cursor:pointer;transition:var(--ease) .3s;backdrop-filter:blur(6px)}
.roam:hover{border-color:var(--cyan);box-shadow:0 0 24px rgba(79,216,255,.4);transform:translateY(-50%) scale(1.1)}
#prev{left:1.2rem}#next{right:1.2rem}
/* ============ KVM CONSOLE ============ */
#kvm{position:fixed;z-index:70;top:74px;bottom:64px;left:50%;width:min(880px,94vw);transform:translate(-50%,18px);border-radius:18px;overflow:hidden;
background:rgba(7,12,19,.92);border:1px solid rgba(79,216,255,.4);box-shadow:0 0 0 1px rgba(79,216,255,.15),0 0 60px rgba(79,216,255,.15),0 40px 90px rgba(0,0,0,.7);backdrop-filter:blur(14px);
opacity:0;visibility:hidden;transition:opacity .5s var(--ease),transform .6s var(--ease),visibility .5s}
#kvm.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
.kbar{display:flex;align-items:center;gap:1rem;padding:.65rem 1.1rem;background:linear-gradient(180deg,#0d1724,#0a121c);border-bottom:1px solid var(--line);font-family:var(--mono)}
.kbar .d{display:flex;gap:6px}
.kbar .d i{width:10px;height:10px;border-radius:50%;background:#22333f}
.kbar .d i:first-child{background:var(--red)}
.kbar .d i:nth-child(2){background:var(--amber)}
.kbar .d i:nth-child(3){background:var(--green)}
.kbar .title{font:600 .8rem var(--mono);letter-spacing:.18em;color:var(--cyan);text-transform:uppercase}
.kbar .live{margin-left:auto;font-size:.62rem;color:var(--green);letter-spacing:.16em}
.kbar .close{border:0;background:transparent;color:var(--mut);font-size:1.1rem;cursor:pointer;padding:.2rem .5rem;border-radius:6px;transition:var(--ease) .25s}
.kbar .close:hover{color:var(--red);background:rgba(255,107,107,.1)}
#screen{position:absolute;top:49px;left:0;right:0;bottom:0;overflow-y:auto;padding:1.6rem 1.8rem;font-size:.95rem}
#screen::before{content:'';position:fixed;pointer-events:none;inset:49px 0 0 0;z-index:5;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
/* console content styles */
.con h2{font:700 clamp(1.3rem,3vw,1.8rem) var(--disp);letter-spacing:.05em;background:linear-gradient(115deg,#eaf7ff,#8fe6ff 60%,#9d8bff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.5rem}
.con .lead{color:var(--txt2);max-width:640px;margin-bottom:1.4rem;line-height:1.8}
.con .lead b{color:var(--txt)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem}
.node-card{background:rgba(14,22,33,.7);border:1px solid var(--line);border-radius:12px;padding:1.1rem 1.2rem;transition:var(--ease) .3s}
.node-card:hover{transform:translateY(-4px);border-color:rgba(79,216,255,.45);box-shadow:0 0 26px rgba(79,216,255,.12)}
.node-card h3{font:600 .95rem var(--disp);color:var(--cyan);margin-bottom:.4rem;letter-spacing:.04em}
.node-card p{color:var(--txt2);font-size:.86rem;line-height:1.7}
.node-card .bars{margin-top:.8rem;display:grid;gap:.55rem}
.brow{display:grid;grid-template-columns:100px 1fr 38px;gap:.6rem;align-items:center;font:.66rem var(--mono);color:var(--txt2)}
.brow .bar{height:6px;background:rgba(110,170,215,.14);border-radius:4px;overflow:hidden}
.brow .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet));border-radius:4px;box-shadow:0 0 10px rgba(79,216,255,.5);transition:width 1.1s var(--ease)}
.brow b{color:var(--cyan);font-weight:500;text-align:right}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.6rem}
.tag{background:rgba(79,216,255,.08);border:1px solid rgba(79,216,255,.35);color:var(--cyan);padding:.25rem .6rem;border-radius:5px;font:.66rem var(--mono);transition:var(--ease) .25s;cursor:default}
.tag:hover{background:var(--cyan);color:#04121a}
.tline{position:relative;padding-left:1.6rem;margin-left:.4rem}
.tline::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--cyan),var(--violet));border-radius:2px}
.titem{position:relative;margin-bottom:1.3rem}
.titem::before{content:'';position:absolute;left:-1.6rem;top:6px;width:12px;height:12px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);border:3px solid var(--bg)}
.titem .co{font:600 .95rem var(--disp);color:var(--violet)}
.titem .pos{font-size:.9rem;color:var(--txt);font-weight:500}
.titem .per{font:.7rem var(--mono);color:var(--amber);margin:.2rem 0 .5rem;letter-spacing:.06em}
.titem ul{list-style:none}
.titem li{color:var(--txt2);font-size:.85rem;margin-bottom:.4rem;padding-left:1.1rem;position:relative}
.titem li::before{content:'▸';position:absolute;left:0;color:var(--cyan);font-size:.7rem;top:2px}
.titem li b{color:var(--txt)}
.pnode{background:rgba(14,22,33,.7);border:1px solid var(--line);border-radius:12px;padding:1.2rem;transition:var(--ease) .3s;cursor:pointer}
.pnode:hover{transform:translateY(-4px);border-color:rgba(157,139,255,.5);box-shadow:0 0 26px rgba(157,139,255,.14)}
.pnode.open{border-color:rgba(79,216,255,.55);box-shadow:0 0 26px rgba(79,216,255,.16)}
.pnode .ph{display:flex;justify-content:space-between;gap:.6rem;align-items:flex-start;margin-bottom:.4rem}
.pnode h3{font:600 1rem var(--disp);color:var(--cyan)}
.pbadge{background:linear-gradient(135deg,var(--violet),var(--cyan));color:#04121a;padding:.2rem .6rem;border-radius:5px;font:.6rem var(--mono);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}
.pper{font:.68rem var(--mono);color:var(--mut);margin-bottom:.6rem}
.pnode p{color:var(--txt2);font-size:.86rem;line-height:1.7;margin-bottom:.7rem}
.pnode .pmore{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .5s var(--ease),opacity .4s}
.pnode.open .pmore{grid-template-rows:1fr;opacity:1}
.pnode .pmore>div{overflow:hidden;min-height:0}
.pnode .pmore ul{list-style:none;margin:.3rem 0}
.pnode .pmore li{color:var(--txt2);font-size:.83rem;padding-left:1.1rem;position:relative;margin-bottom:.4rem}
.pnode .pmore li::before{content:'▸';position:absolute;left:0;color:var(--violet)}
.phint{font:.64rem var(--mono);color:var(--mut);letter-spacing:.16em;text-transform:uppercase}
.phint .ch{color:var(--cyan)}
.plinks{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.6rem}
.plinks a{color:var(--blue,#7fb4e6);text-decoration:none;font:.72rem var(--mono);padding:.35rem .8rem;border:1px solid rgba(127,180,230,.45);border-radius:6px;transition:var(--ease) .25s}
.plinks a:hover{background:#7fb4e6;color:#04121a}
/* ===== disk attach lab (projects) ===== */
.disklab{display:grid;grid-template-columns:230px 1fr;gap:1.2rem;margin-top:1rem}
@media(max-width:760px){.disklab{grid-template-columns:1fr}}
.labbox{background:rgba(10,16,24,.75);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem}
.labbox .lt{font:600 .62rem var(--mono);letter-spacing:.22em;color:var(--mut);text-transform:uppercase;margin-bottom:.8rem}
/* shelf disks (2.5" SSD side view) */
.shelf{display:grid;gap:.7rem}
.disk{position:relative;display:flex;align-items:center;gap:.7rem;background:linear-gradient(180deg,#101a26,#0a1219);border:1px solid var(--line2);border-radius:8px;padding:.7rem .8rem;cursor:pointer;transition:transform var(--ease) .3s,border-color .3s,box-shadow .3s;text-align:left;width:100%}
.disk:hover{transform:translateY(-3px);border-color:var(--cyan);box-shadow:0 0 18px rgba(79,216,255,.25)}
.disk.busy{opacity:.35;pointer-events:none}
.disk.attached{border-color:rgba(92,232,168,.6);box-shadow:0 0 16px rgba(92,232,168,.25);pointer-events:none;opacity:.6}
.disk .dsn{font:600 .72rem var(--mono);color:var(--txt);letter-spacing:.05em}
.disk .dsk{font:.6rem var(--mono);color:var(--mut);letter-spacing:.1em}
.disk .dled{margin-left:auto;width:8px;height:8px;border-radius:50%;background:#1d3346}
.disk.attached .dled{background:var(--green);box-shadow:0 0 9px var(--green);animation:pulse 2s infinite}
.disk .pins{flex:none;display:flex;gap:2px}
.disk .pins i{width:3px;height:14px;background:#1a2a3a;border-radius:1px}
/* bay: side view slot */
.slot{position:relative;height:64px;border:1px solid var(--line2);border-radius:8px;background:linear-gradient(180deg,#070c12,#0b131d);overflow:hidden;box-shadow:inset 0 8px 18px rgba(0,0,0,.55)}
.slot .rail{position:absolute;top:10px;bottom:10px;left:0;right:0;background:repeating-linear-gradient(90deg,rgba(110,170,215,.08) 0 6px,transparent 6px 14px)}
.slot .sled{position:absolute;top:9px;bottom:9px;left:12%;right:34%;background:linear-gradient(180deg,#16222e,#0d1520);border:1px solid rgba(110,170,215,.35);border-radius:5px;display:flex;align-items:center;padding:0 .8rem;gap:.7rem;font:.66rem var(--mono);color:var(--txt2);letter-spacing:.08em;
transform:translateX(-340%) ;transition:transform 1.1s var(--ease),opacity .5s;opacity:0}
.slot .sled.in{transform:translateX(0);opacity:1}
.slot .sled .sledled{margin-left:auto;width:9px;height:9px;border-radius:50%;background:#1d3346;transition:background .3s,box-shadow .3s}
.slot .sled.l-amber .sledled{background:var(--amber);box-shadow:0 0 10px var(--amber);animation:pulse .5s infinite}
.slot .sled.l-green .sledled{background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2s infinite}
.slot .handle{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:26px;border:1px solid var(--line2);border-radius:5px;background:linear-gradient(180deg,#182634,#101a24);display:flex;align-items:center;justify-content:center;font:.6rem var(--mono);color:var(--mut)}
.eject{margin-top:.8rem;width:100%;border:1px solid rgba(255,107,107,.35);background:rgba(255,107,107,.06);color:var(--red);border-radius:7px;padding:.5rem;font:500 .68rem var(--mono);letter-spacing:.14em;cursor:pointer;transition:var(--ease) .25s;opacity:.35;pointer-events:none}
.eject.on{opacity:1;pointer-events:auto}
.eject.on:hover{background:rgba(255,107,107,.15);box-shadow:0 0 14px rgba(255,107,107,.2)}
/* boot terminal in bay */

/* ===== silicon lab (cpu / gpu dies) ===== */
.tgl{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;font:500 .68rem var(--mono);margin-bottom:1rem}
.tgl button{background:transparent;border:0;color:var(--txt2);padding:.55rem 1.1rem;cursor:pointer;letter-spacing:.16em;text-transform:uppercase;transition:var(--ease) .3s}

.die{position:relative;background:linear-gradient(180deg,#0a1220,#070d16);border:1px solid var(--line2);border-radius:12px;padding:1.1rem;box-shadow:inset 0 0 40px rgba(0,0,0,.5),0 0 24px rgba(79,216,255,.06)}
.die .dlabel{display:flex;justify-content:space-between;font:.62rem var(--mono);color:var(--mut);letter-spacing:.2em;text-transform:uppercase;margin-bottom:.8rem}

.cores{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}

.core.hot i{background:var(--cyan);box-shadow:0 0 12px rgba(79,216,255,.8)}

.core.mid i{background:#2e7a96;box-shadow:0 0 7px rgba(79,216,255,.4)}

.core.hot .u{color:var(--cyan)}
.cacheline{margin-top:.8rem;display:flex;flex-direction:column;gap:4px;font:.58rem var(--mono);color:var(--txt2)}
.cacheline .cl{display:grid;grid-template-columns:64px 1fr 46px;gap:.6rem;align-items:center}

.cacheline b{color:var(--violet);font-weight:500}
/* GPU SM grid */
.sms{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.sm{border:1px solid rgba(110,170,215,.25);border-radius:6px;background:#0b1420;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;transition:var(--ease) .3s}
.sm span{aspect-ratio:1;border-radius:2px;background:#16293a;transition:var(--ease) .3s}
.sm.act{border-color:rgba(157,139,255,.6);box-shadow:0 0 12px rgba(157,139,255,.35)}
.sm.act span{background:var(--violet);box-shadow:0 0 6px rgba(157,139,255,.7)}

.vram{margin-top:.8rem;display:grid;grid-template-columns:64px 1fr 46px;gap:.6rem;align-items:center;font:.58rem var(--mono);color:var(--txt2)}
.vram .vm{height:12px;border-radius:4px;background:rgba(110,170,215,.12);overflow:hidden}
.vram .vm i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--violet));border-radius:4px;transition:width 1.4s var(--ease)}
.vram b{color:var(--amber);font-weight:500}
.klaunch{margin-top:1rem;width:100%;border:1px solid rgba(157,139,255,.45);background:rgba(157,139,255,.08);color:var(--violet);border-radius:8px;padding:.6rem;font:500 .7rem var(--mono);letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:var(--ease) .3s}
.klaunch:hover{background:rgba(157,139,255,.18);box-shadow:0 0 20px rgba(157,139,255,.3);transform:translateY(-2px)}
.silnote{margin-top:1rem;font:.68rem/1.8 var(--mono);color:var(--txt2);border-left:2px solid rgba(79,216,255,.4);padding-left:.9rem}
.silnote b{color:var(--cyan)}
/* sbatch job lab */
.jobctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.9rem;margin-bottom:1rem}
.jobctl label{display:flex;flex-direction:column;gap:.35rem;font:.62rem var(--mono);color:var(--mut);letter-spacing:.12em;text-transform:uppercase}
.jobctl select,.jobctl input[type=range]{accent-color:var(--cyan);background:var(--panel);border:1px solid var(--line2);color:var(--txt);border-radius:6px;padding:.4rem;font-family:var(--mono)}
.jobctl input[type=range]{padding:0}
.jobctl label[style],.jobctl .chk{flex-direction:row;align-items:center;gap:.5rem;color:var(--txt2);text-transform:none;letter-spacing:.04em;font-size:.72rem}
.jobctl input[type=checkbox]{accent-color:var(--cyan);width:15px;height:15px}
.jobctl output{color:var(--cyan);font:600 .8rem var(--mono)}
.sbscript{background:rgba(4,8,13,.9);border:1px solid var(--line);border-radius:9px;padding:1rem 1.1rem;font:.72rem/1.8 var(--mono);color:var(--green);white-space:pre-wrap;margin-bottom:1rem;overflow-x:auto}
.sbscript .k{color:var(--violet)}.sbscript .c{color:var(--mut)}.sbscript .s{color:var(--cyan)}
.jterm{background:rgba(4,8,13,.9);border:1px solid var(--line);border-radius:9px;padding:.85rem 1rem;font:.7rem/1.75 var(--mono);color:var(--txt2);white-space:pre-wrap;min-height:96px}
.jterm .ok{color:var(--green)}.jterm .wn{color:var(--amber)}.jterm .rd{color:var(--red)}.jterm .hi{color:var(--cyan)}
.jterm .crt{display:inline-block;width:7px;height:13px;vertical-align:-2px;background:var(--cyan);animation:pulse 1s steps(2) infinite}
.jlive{margin-top:.9rem}
.jmeta{display:flex;gap:1.4rem;flex-wrap:wrap;font:.62rem var(--mono);color:var(--mut);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.5rem}
.jmeta b{color:var(--cyan);font-weight:600}
#jgraph{width:100%;height:90px;border:1px solid var(--line);border-radius:9px;background:rgba(4,8,13,.9)}
/* cores/SMs reserved by a running job */
.core.job i{background:var(--violet);box-shadow:0 0 13px rgba(157,139,255,.9)}
.core.job{border-color:rgba(157,139,255,.7)}
.core.job .u{color:var(--violet)}
.sm.job{border-color:rgba(157,139,255,.7);box-shadow:0 0 14px rgba(157,139,255,.4)}
.sm.job span{background:var(--violet);box-shadow:0 0 7px rgba(157,139,255,.8)}
.sm.job.tensor span:nth-child(4n){background:var(--amber);box-shadow:0 0 8px rgba(255,180,84,.9)}
/* drag & drop states */
.disk{touch-action:none;user-select:none;-webkit-user-select:none}
.disk.ghost{position:fixed;z-index:400;width:225px;pointer-events:none;opacity:.96;transform:scale(1.06);box-shadow:0 16px 44px rgba(0,0,0,.65),0 0 26px rgba(79,216,255,.4)}
.disk.lift{opacity:.25}
.slot.hover{border-color:var(--cyan);box-shadow:inset 0 8px 18px rgba(0,0,0,.55),0 0 28px rgba(79,216,255,.45)}
.slot.hover .handle{border-color:var(--cyan);color:var(--cyan)}
.datechip{display:inline-block;font:.66rem var(--mono);color:var(--amber);border:1px solid rgba(255,180,84,.3);background:rgba(255,180,84,.06);padding:.2rem .65rem;border-radius:99px;margin-bottom:.5rem;letter-spacing:.08em}
.ecard h3{font:600 .95rem var(--disp);color:var(--cyan);margin-bottom:.35rem}
.ecard p{color:var(--txt2);font-size:.85rem}
.elink{display:inline-block;margin-top:.5rem;font:.7rem var(--mono);color:#7fb4e6;text-decoration:none}
.elink:hover{color:var(--cyan)}
.score{display:inline-block;font:.68rem var(--mono);color:var(--green);border:1px solid rgba(92,232,168,.35);border-radius:99px;padding:.15rem .65rem;margin-bottom:.45rem}
.clinks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.9rem}
.clinks a{background:rgba(14,22,33,.7);border:1px solid var(--line);border-radius:12px;padding:1rem;display:flex;gap:.8rem;align-items:center;text-decoration:none;color:var(--txt);transition:var(--ease) .3s}
.clinks a:hover{transform:translateY(-4px);border-color:rgba(79,216,255,.5);box-shadow:0 0 24px rgba(79,216,255,.14)}
.clinks .ic{font-size:1.5rem;color:var(--cyan)}
.clinks .lb{font:.62rem var(--mono);color:var(--mut);text-transform:uppercase;letter-spacing:.12em}
.clinks .vl{font:600 .9rem var(--disp);color:var(--cyan);word-break:break-all}
.btnrow{display:flex;gap:.8rem;flex-wrap:wrap;margin:1.2rem 0}
.btn{display:inline-block;padding:.75rem 1.3rem;font:500 .8rem var(--mono);text-decoration:none;border-radius:9px;border:1.5px solid transparent;cursor:pointer;transition:var(--ease) .3s;text-transform:uppercase;letter-spacing:.08em}
.btn-c{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#04121a;box-shadow:0 0 22px rgba(79,216,255,.3)}
.btn-c:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 0 36px rgba(79,216,255,.55)}
.btn-g{background:rgba(14,22,33,.8);color:var(--cyan);border-color:rgba(79,216,255,.4)}
.btn-g:hover{transform:translateY(-3px);box-shadow:0 0 22px rgba(79,216,255,.3)}
.stats{display:flex;gap:1.4rem;flex-wrap:wrap;margin-top:1rem}
.stats>div{padding-left:.9rem;border-left:2px solid rgba(79,216,255,.4)}
.stats b{display:block;font:700 1.6rem/1.1 var(--disp);color:var(--cyan)}
.stats span{font:.68rem var(--mono);color:var(--mut)}
.term{background:rgba(6,10,16,.85);border:1px solid var(--line);border-radius:10px;padding:1rem;font:.78rem/1.8 var(--mono);color:var(--txt2);white-space:pre-wrap;margin-top:1rem}
.term .p{color:var(--cyan)}.term .c{color:var(--green)}.term .o{color:var(--txt)}
.caret{display:inline-block;width:8px;height:15px;vertical-align:-2px;background:var(--cyan);animation:pulse 1s steps(2) infinite}
.fadein{animation:cup .55s var(--ease) both}
@keyframes cup{from{opacity:0;transform:translateY(14px)}to{opacity:1}}
/* ===== skills blade carousel ===== */
.skwrap{position:relative;margin:.8rem 0 .4rem;user-select:none;-webkit-user-select:none}
.skstage{position:relative;height:clamp(230px,36vh,320px);perspective:1100px;overflow:hidden;touch-action:pan-y;cursor:grab}
.skstage:active{cursor:grabbing}
.skstage::after{content:'';position:absolute;left:14%;right:14%;bottom:4px;height:36px;pointer-events:none;background:radial-gradient(50% 100% at 50% 0,rgba(79,216,255,.16),transparent 72%);filter:blur(2px)}
.skrot{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s var(--ease)}
.skrot.drag{transition:none}
.skcard{position:absolute;left:50%;top:50%;width:clamp(150px,19vw,188px);height:clamp(198px,29vh,248px);border-radius:12px;cursor:pointer;
background:linear-gradient(180deg,#0e1723,#0a1017);border:1px solid rgba(110,170,215,.25);box-shadow:0 18px 40px rgba(0,0,0,.55);
display:flex;flex-direction:column;gap:6px;padding:12px;backface-visibility:hidden;transition:border-color .4s,box-shadow .5s,opacity .5s}
.skcard .sic{font-size:1.8rem;line-height:1}
.skcard .snm{font:600 .76rem var(--disp);color:var(--cyan);letter-spacing:.04em}
.skcard .sbl{flex:1;display:flex;gap:5px;justify-content:center;margin-top:6px}
.skcard .sbl i{width:26px;border-radius:3px;background:linear-gradient(180deg,#101c29,#0a121a);border:1px solid rgba(110,170,215,.2);position:relative}
.skcard .sbl i::after{content:'';position:absolute;top:6px;left:6px;right:6px;height:2px;background:rgba(79,216,255,.25)}
.skcard .sled{display:flex;gap:6px;justify-content:center}
.skcard .sled i{width:5px;height:5px;border-radius:50%;background:#1d3346}
.skcard .feat{display:none;position:absolute;top:-12px;left:50%;transform:translateX(-50%);white-space:nowrap;font:.56rem var(--mono);color:#04121a;background:linear-gradient(90deg,var(--cyan),var(--violet));padding:.16rem .6rem;border-radius:99px;letter-spacing:.16em;box-shadow:0 0 14px rgba(79,216,255,.5)}
.skcard.on{border-color:rgba(79,216,255,.65);box-shadow:0 0 34px rgba(79,216,255,.3),0 0 0 1px rgba(79,216,255,.25),0 18px 40px rgba(0,0,0,.55)}
.skcard.on .feat{display:block}
.skcard.on .sled i:nth-child(1){background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.3s infinite}
.skcard.on .sled i:nth-child(3){background:var(--amber);box-shadow:0 0 8px var(--amber);animation:pulse 2s infinite}
.skcard.off{opacity:.26;filter:saturate(.5)}
.sknav{display:flex;align-items:center;justify-content:center;gap:1.1rem;margin-top:.4rem}
.sknav button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line2);background:rgba(10,17,25,.8);color:var(--cyan);font-size:1.1rem;cursor:pointer;transition:var(--ease) .3s}
.sknav button:hover{border-color:var(--cyan);box-shadow:0 0 18px rgba(79,216,255,.4);transform:scale(1.08)}
.skdots{display:flex;gap:.42rem}
.skdots i{width:8px;height:8px;border-radius:50%;background:#22384a;cursor:pointer;transition:var(--ease) .3s}
.skdots i.on{background:var(--cyan);box-shadow:0 0 8px rgba(79,216,255,.7)}
/* ===== experience live ops ===== */
.opsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.9rem}
.opline{background:rgba(10,16,24,.75);border:1px solid var(--line);border-radius:10px;padding:.8rem .9rem}
.opline .ot{display:flex;justify-content:space-between;font:.6rem var(--mono);color:var(--mut);letter-spacing:.14em;text-transform:uppercase;margin-bottom:.55rem}
.opline .ot b{color:var(--cyan)}
.obar{height:7px;border-radius:4px;background:rgba(110,170,215,.12);overflow:hidden}
.obar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--cyan));border-radius:4px;box-shadow:0 0 10px rgba(92,232,168,.5);transition:width .2s linear}
/* ===== events blog ===== */
.blogfeed{max-height:min(430px,48vh);overflow-y:auto;padding:.3rem .5rem .3rem .1rem}
.bpost{position:relative;background:rgba(14,22,33,.7);border:1px solid var(--line);border-radius:12px;padding:1.1rem 1.25rem;margin-bottom:1rem;opacity:0;transform:translateY(20px) scale(.985);transition:opacity .7s var(--ease),transform .7s var(--ease),border-color .3s}

.bpost .bt{font:600 1rem var(--disp);color:var(--cyan);margin:.45rem 0 .5rem;letter-spacing:.02em}
.bpost p{color:var(--txt2);font-size:.86rem;line-height:1.75}
.bpost .elink{display:inline-block;margin-top:.6rem}

.hobbies{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.2rem}

.hob{background:rgba(14,22,33,.7);border:1px solid var(--line);border-radius:12px;padding:1.1rem;display:flex;flex-direction:column;align-items:center;gap:.75rem}
.hob .ht{font:600 .66rem var(--mono);color:var(--mut);letter-spacing:.18em;text-transform:uppercase;text-align:center}
/* camera */
.cam{position:relative;width:112px;height:78px;cursor:pointer}
.cam span{display:block;position:absolute}
.cam .body{inset:16px 0 0 0;background:linear-gradient(180deg,#1b2634,#101a26);border:1px solid rgba(110,170,215,.4);border-radius:8px}
.cam .hump{left:28px;top:0;width:56px;height:22px;background:#16202e;border:1px solid rgba(110,170,215,.4);border-radius:6px 6px 0 0}
.cam .lens{left:50%;top:54%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2e4a63,#08111c 72%);border:2px solid rgba(110,170,215,.5);box-shadow:0 0 16px rgba(79,216,255,.35)}
.cam .lens::after{content:'';position:absolute;inset:8px;border-radius:50%;border:1px dashed rgba(79,216,255,.55);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cam .flash{right:12px;top:22px;width:11px;height:8px;border-radius:3px;background:#233447;transition:box-shadow .2s,background .2s}
.cam.flash .flash{background:#fff;box-shadow:0 0 24px 8px rgba(255,255,255,.85)}
.cam .shut{inset:0;background:#fff;opacity:0;pointer-events:none;border-radius:8px;transition:opacity .25s}
.cam.flash .shut{opacity:.5;transition:none}
/* rubik cube */
.cubewrap{width:112px;height:112px;perspective:640px;display:flex;align-items:center;justify-content:center}
.cube{position:relative;width:72px;height:72px;transform-style:preserve-3d;animation:cubespin 80s linear infinite}
.cubewrap{cursor:grab}
.cubewrap:active{cursor:grabbing}
.cube div{position:absolute;inset:0;border-radius:5px;background-color:var(--fc);

@keyframes cubespin{from{transform:rotateX(-24deg) rotateY(0)}to{transform:rotateX(-24deg) rotateY(360deg)}}
.cube .f1{--fc:#ff5b5b;transform:translateZ(36px)}
.cube .f2{--fc:#ffb454;transform:rotateY(180deg) translateZ(36px)}
.cube .f3{--fc:#5ce8a8;transform:rotateY(90deg) translateZ(36px)}
.cube .f4{--fc:#4fd8ff;transform:rotateY(-90deg) translateZ(36px)}
.cube .f5{--fc:#f2f4f8;transform:rotateX(90deg) translateZ(36px)}
.cube .f6{--fc:#9d8bff;transform:rotateX(-90deg) translateZ(36px)}

background:
linear-gradient(180deg,rgba(79,216,255,.11),rgba(79,216,255,.02)),

rackEls.forEach((el,k)=>el.classList.toggle('on',k===active));

}
document.getElementById('prev').addEventListener('click',()=>select(active-1,false));
document.getElementById('next').addEventListener('click',()=>select(active+1,false));
addEventListener('keydown',e=>{
if(e.key==='ArrowLeft'){select(active-1,false)}
else if(e.key==='ArrowRight'){select(active+1,false)}
else if(e.key==='Enter'){openKVM(active)}
else if(e.key==='Escape'){closeKVM()}
});
/* ---------- swipe / drag the rack corridor with the cursor ---------- */
const stage=document.getElementById('stage');
let swx=0,swstart=0,swdrag=false;
function camX(){const m=/translateX\(([-\d.]+)px\)/.exec(cam.style.transform||'');return m?+m[1]:0}
stage.addEventListener('pointerdown',e=>{if(e.button!==0)return;swdrag=true;swmoved=false;swx=e.clientX;swstart=camX();cam.style.transition='none'});
addEventListener('pointermove',e=>{if(!swdrag)return;const dx=e.clientX-swx;if(Math.abs(dx)>8)swmoved=true;cam.style.transform='translateX('+(swstart+dx)+'px)'});
addEventListener('pointerup',e=>{if(!swdrag)return;swdrag=false;cam.style.transition='';const dx=e.clientX-swx;
if(dx<-70)select(active+1,false);else if(dx>70)select(active-1,false);else select(active,false)});
/* ---------- KVM console ---------- */
const kvm=document.getElementById('kvm'),screen=document.getElementById('screen'),ktitle=document.getElementById('ktitle');
function openKVM(i){
const r=RACKS[i];ktitle.textContent=r.title;
screen.scrollTop=0;
screen.innerHTML='';
screen.appendChild(document.getElementById('t-'+r.id).content.cloneNode(true));
kvm.classList.add('show');
/* activate bars + counters inside console */
screen.querySelectorAll('.bar i').forEach((b,k)=>setTimeout(()=>b.style.width=b.dataset.w+'%',300+k*130));
screen.querySelectorAll('[data-count]').forEach(el=>{
const to=+el.dataset.count,suf=el.dataset.suffix||'',t0=performance.now();
(function f(t){const p=Math.min((t-t0)/1300,1);el.textContent=Math.round(to*(1-Math.pow(1-p,4)))+suf;if(p<1)requestAnimationFrame(f)})(t0);
});
screen.querySelectorAll('[data-go]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const k=RACKS.findIndex(r=>r.id===a.dataset.go);select(k,true)}));
/* mini terminal on home */
const mt=document.getElementById('miniterm');
if(mt)typeTerm(mt);
if(r.id==='projects')wireDisks();
if(r.id==='silicon')wireSilicon();
if(r.id==='skills')wireSkills();
if(r.id==='experience')wireExp();
/* blog / reveal-on-scroll transitions */
const rvs=screen.querySelectorAll('.rv');
if(rvs.length){const ob=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('vis');ob.unobserve(x.target)}}),{root:screen,threshold:.12});rvs.forEach(el=>ob.observe(el))}
/* hobby camera: click = take a shot */
const hcam=screen.querySelector('.cam');
if(hcam)hcam.addEventListener('click',()=>{hcam.classList.add('flash');setTimeout(()=>hcam.classList.remove('flash'),320)});
/* rubik cube: very slow auto-spin, cursor drag takes control */
const cw=screen.querySelector('.cubewrap');
if(cw){const cb=cw.querySelector('.cube');
cb.style.animation='none';
let rx=-24,ry=0,vel=.03,cdrag=false,lx=0,ly=0,it=null;
cw.style.touchAction='none';
cw.addEventListener('pointerdown',e=>{cdrag=true;lx=e.clientX;ly=e.clientY;try{cw.setPointerCapture(e.pointerId)}catch(_){}} );
cw.addEventListener('pointermove',e=>{if(!cdrag)return;
ry+=(e.clientX-lx)*.5;rx=Math.max(-85,Math.min(85,rx-(e.clientY-ly)*.5));
lx=e.clientX;ly=e.clientY;vel=0;clearTimeout(it);it=setTimeout(()=>{vel=.03},1800)});
const endD=()=>{cdrag=false};
cw.addEventListener('pointerup',endD);cw.addEventListener('pointercancel',endD);
(function spin(){if(!document.body.contains(cb))return;
if(!cdrag)ry+=vel;
cb.style.transform='rotateX('+rx+'deg) rotateY('+ry+'deg)';
requestAnimationFrame(spin)})();
}
}

/* ---------- silicon lab: CPU cores + GPU SMs ---------- */
let silTimer=null;
function wireSilicon(){
if(silTimer){clearInterval(silTimer);silTimer=null}
const cores=document.getElementById('cores'),sms=document.getElementById('sms');
if(!cores||!sms)return;
/* build 16 cpu cores */
cores.innerHTML='';
for(let i=0;i<24;i++){const c=document.createElement('div');c.className='core idle';
c.innerHTML='<i></i><span class="u">0%</span>';cores.appendChild(c)}
const coreEls=[...cores.children];
/* build 32 SMs (8×4), each with 8 cuda lanes + tensor marker */
sms.innerHTML='';
for(let i=0;i<32;i++){const s=document.createElement('div');s.className='sm'+(i%4===0?' tensor':'');
for(let j=0;j<8;j++)s.appendChild(document.createElement('span'));sms.appendChild(s)}
const smEls=[...sms.children];
/* cpu: live per-core utilization waves (cores reserved by a job are skipped) */
function cpuTick(){
coreEls.forEach((c,i)=>{
if(c.classList.contains('job')){c.querySelector('.u').textContent='100%';return}
const u=Math.max(2,Math.round(95*Math.abs(Math.sin(Date.now()/900+i*.7))*(Math.random()<.8?1:.25)));
const cls=u>70?'hot':u>30?'mid':'idle';
c.className='core '+cls;c.querySelector('.u').textContent=u+'%';
});
document.getElementById('cpu-clk').textContent=(3.1+Math.random()*.3).toFixed(1)+' GHz';
document.getElementById('l1b').style.width=(28+Math.random()*10)+'%';
document.getElementById('l2b').style.width=(42+Math.random()*14)+'%';
document.getElementById('l3b').style.width=(58+Math.random()*18)+'%';
}
/* gpu: launch kernel = wave sweep across SMs + vram fill */
let wave=-1;
function gpuWave(){
if(wave<0)return;
smEls.forEach((s,i)=>{
const d=i-wave;
s.classList.toggle('act',d>=0&&d<6);
});
if(wave<smEls.length+6){wave++}
else{
wave=-1;smEls.forEach(s=>s.classList.remove('act'));
const v=document.getElementById('vramb');
let p=Math.min(92,parseFloat(v.style.width||'0')+14+Math.random()*10);
v.style.width=p+'%';document.getElementById('vramt').textContent=Math.round(p)+'% HBM';
document.getElementById('gpu-clk').textContent=(1750+Math.random()*220).toFixed(0)+' MHz';
}
}
silTimer=setInterval(()=>{cpuTick();gpuWave()},700);
cpuTick();
/* idle SM shimmer */
(function shimmer(){
if(!document.body.contains(sms))return;
smEls.forEach(s=>{if(!s.classList.contains('act')&&!s.classList.contains('job')&&Math.random()<.06){
s.classList.add('act');setTimeout(()=>s.classList.remove('act'),260)}});
setTimeout(shimmer,450);
})();
document.getElementById('klaunch').addEventListener('click',()=>{
if(wave<0){wave=0;const v=document.getElementById('vramb');
if(parseFloat(v.style.width||'0')>85){v.style.width='0%';document.getElementById('vramt').textContent='0% HBM'}}
});
/* toggle cpu / gpu die */
document.querySelectorAll('.tgl button').forEach(b=>b.addEventListener('click',()=>{

/* ---------- sbatch job submission lab ---------- */
const jpart=document.getElementById('j-part'),jcores=document.getElementById('j-cores'),
jcoresv=document.getElementById('j-coresv'),jtime=document.getElementById('j-time'),
jmp=document.getElementById('j-mpi'),sb=document.getElementById('sbscript'),
jterm=document.getElementById('jterm'),jlive=document.getElementById('jlive'),
jsub=document.getElementById('jsubmit');
let jobTimer=null,jobRun=false;
function fmt(sec){return'00:'+String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function updScript(){
const p=jpart.value,n=+jcores.value,dur=+jtime.value,mpi=jmp.checked;
const gpu=p==='gpu';
sb.innerHTML=
(gpu?'<span class="c">#!/bin/bash</span>\n'
:'<span class="c">#!/bin/bash</span>\n')+
'<span class="k">#SBATCH</span> --job-name='+(gpu?'cuda_simd':'hpc_bench')+'\n'+
'<span class="k">#SBATCH</span> --partition='+p+'\n'+
'<span class="k">#SBATCH</span> --nodes=1\n'+
(gpu?'<span class="k">#SBATCH</span> --gres=gpu:rtx:1\n':'')+
(mpi?'<span class="k">#SBATCH</span> --ntasks='+n+'\n':'<span class="k">#SBATCH</span> --ntasks=1 --cpus-per-task='+n+'\n')+
'<span class="k">#SBATCH</span> --time='+fmt(dur)+'\n'+
'<span class="k">#SBATCH</span> --output='+(gpu?'gpu':'job')+'_%j.out\n\n'+
(gpu
? mpi?'<span class="c"># launch one CUDA rank per SM block, NCCL collective</span>\n<span class="s">srun</span> --gres=gpu:rtx:1 ./cuda_kernel --sm '+n+' --warps 32\n'
:'<span class="c"># single rank, '+n+' CUDA streams — parallel GPU compute</span>\n<span class="s">srun</span> --gres=gpu:rtx:1 ./cuda_kernel --sm '+n+' --streams '+n+'\n'
: mpi?'<span class="c"># MPI: '+n+' parallel ranks pinned to cores (OMP_NUM_THREADS=1)</span>\n<span class="s">srun</span> --ntasks='+n+' --cpu-bind=cores ./hpc_bench --ranks '+n+'\n'
:'<span class="c"># OpenMP: single rank, '+n+' threads (SIMD / AVX-512 streams)</span>\n<span class="s">srun</span> --cpus-per-task='+n+' ./hpc_bench --threads '+n+'\n');
}
[jpart,jtime].forEach(el=>el.addEventListener('change',()=>{updScript();if(jcores.max!==24&&jpart.value==='cpu')jcores.max=24}));
jmp.addEventListener('change',updScript);

function jt(html){

jterm.scrollTop=jterm.scrollHeight}

sel.forEach((c,i)=>{if(i<n)c.classList.add('job')});
jt('<span class="hi">$</span> sbatch job.sh');
setTimeout(()=>jt('<span class="ok">Submitted batch job '+id+'</span>'),350);
setTimeout(()=>jt('<span class="hi">$</span> squeue --me\n<span class="ok">JOBID  PARTITION  NAME       ST  TIME       NODES\n'+id+'  '+jpart.value.padEnd(9)+'  '+(gpu?'cuda_simd':'hpc_bench').padEnd(9)+' R   00:00:00   ps-node01</span>'),800);
jlive.style.display='';
document.getElementById('j-id').textContent=id;
document.getElementById('j-coresd').textContent=n+(gpu?' SMs':' cores');
const g=document.getElementById('jgraph'),g2=g.getContext('2d');
const pts=[];const t0=Date.now();
function draw(){
const W=g.width=g.offsetWidth,H=g.height=90;
g2.clearRect(0,0,W,H);
g2.strokeStyle='rgba(110,170,215,.12)';
for(let y=15;y<H;y+=18){g2.beginPath();g2.moveTo(0,y);g2.lineTo(W,y);g2.stroke()}
g2.strokeStyle='rgba(110,170,215,.25)';g2.strokeRect(.5,.5,W-1,H-1);
g2.beginPath();
pts.forEach((p,i)=>{const x=p[0]*W,y=H-6-p[1]*(H-16);i?g2.lineTo(x,y):g2.moveTo(x,y)});
g2.strokeStyle='#4fd8ff';g2.lineWidth=1.6;g2.shadowColor='rgba(79,216,255,.6)';g2.shadowBlur=6;g2.stroke();
g2.shadowBlur=0;
g2.fillStyle='#9d8bff';g2.font='9px JetBrains Mono';
g2.fillText(gpu?'GPU THROUGHPUT (TFLOPS)':'CPU THROUGHPUT (GFLOPS)',6,12);
}
draw();
jobTimer=setInterval(()=>{
const el=(Date.now()-t0)/1000,left=Math.max(0,dur-el);
document.getElementById('j-left').textContent=fmt(Math.ceil(left));
document.getElementById('j-state').textContent=left>0?(el<1?'STARTING':'RUNNING'):'COMPLETING';
pts.push([Math.min(1,el/dur),Math.max(.25,Math.min(1,.55+.4*Math.sin(el*2.2)+Math.random()*.15))]);
draw();
if(left<=0){
clearInterval(jobTimer);jobTimer=null;jobRun=false;
document.getElementById('j-state').textContent='COMPLETED';
document.getElementById('j-left').textContent='00:00:00';
jt('<span class="ok">slurmstepd: job '+id+' COMPLETED — exit code 0</span>');
jt('<span class="hi">$</span> sacct -j '+id+' --format=JobID,Elapsed,MaxRSS%10\n<span class="ok">'+id+'  '+fmt(dur)+'   1.2G    # peak</span>');
sel.forEach(c=>c.classList.remove('job'));
setTimeout(()=>{if(!jobRun)jterm.innerHTML='<span class="rd">[ IDLE ]</span> scheduler ready — cores released.<span class="crt"></span>'},2600);
}
},200);
});
if(jobTimer){clearInterval(jobTimer);jobTimer=null}
}

function wireDisks(){
const shelf=document.getElementById('shelf'),sled=document.getElementById('sled'),
boot=document.getElementById('bootterm'),det=document.getElementById('pdetail'),ej=document.getElementById('eject'),
lbl=sled.querySelector('.sledlbl');
let busy=false;
function reset(){
sled.classList.remove('in','l-amber','l-green');lbl.textContent='— no disk mounted —';
boot.innerHTML='<span class="rd">[ STANDBY ]</span> awaiting disk attach…<span class="crt"></span>';
det.innerHTML='';ej.classList.remove('on');
shelf.querySelectorAll('.disk').forEach(d=>d.classList.remove('attached','busy'));
}
function attachDisk(d){
if(busy)return;const dsk=DISKS[d.dataset.d];if(!dsk||d.classList.contains('attached'))return;
busy=true;
shelf.querySelectorAll('.disk').forEach(x=>{x.classList.add('busy');x.classList.remove('attached')});
d.classList.remove('busy');d.classList.add('attached');
det.innerHTML='';
boot.innerHTML='';
/* disk slides into the slot */
lbl.textContent=dsk.name+' · '+dsk.img;
sled.classList.add('in','l-amber');
/* boot sequence types project-specific lines */
const reduce2=matchMedia('(prefers-reduced-motion:reduce)').matches;
let li=0;
function line(){
if(li>=dsk.boot.length){
sled.classList.remove('l-amber');sled.classList.add('l-green');
const wrap=document.createElement('div');wrap.className='fadein';wrap.innerHTML=dsk.html;
det.appendChild(wrap);
ej.classList.add('on');busy=false;
shelf.querySelectorAll('.disk').forEach(x=>x.classList.remove('busy'));
return}
const row=document.createElement('div');row.style.opacity=0;row.style.transition='opacity .3s';
row.innerHTML=dsk.boot[li].replace(/\[ok\]/g,'<span class="ok">[ OK ]</span>').replace(/\[wn\]/g,'<span class="wn">[WARN]</span>').replace(/\[hi\]/g,'<span class="hi">').replace(/\[rd\]/g,'<span class="rd">')+((dsk.boot[li].indexOf('[hi]')>=0||dsk.boot[li].indexOf('[rd]')>=0)?'</span>':'');
boot.appendChild(row);requestAnimationFrame(()=>row.style.opacity=1);
li++;setTimeout(line,reduce2?20:380);
}
setTimeout(line,reduce2?50:1150);
}
/* drag & drop: shelf disk → bay slot (click/tap fallback kept) */
const slot=document.getElementById('theslot');
function overSlot(ev){const r=slot.getBoundingClientRect();
return ev.clientX>r.left-50&&ev.clientX<r.right+50&&ev.clientY>r.top-60&&ev.clientY<r.bottom+60}
shelf.querySelectorAll('.disk').forEach(d=>{
let sx=0,sy=0,ghost=null,dragging=false;
d.addEventListener('pointerdown',e=>{
if(busy||d.classList.contains('attached'))return;
sx=e.clientX;sy=e.clientY;dragging=false;
const mv=ev=>{
if(!dragging&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){
dragging=true;
ghost=d.cloneNode(true);ghost.classList.add('ghost');ghost.style.width=d.offsetWidth+'px';
document.body.appendChild(ghost);d.classList.add('lift');
}
if(dragging&&ghost){
ghost.style.left=(ev.clientX-d.offsetWidth/2)+'px';
ghost.style.top=(ev.clientY-26)+'px';
slot.classList.toggle('hover',overSlot(ev));
}
};
const up=ev=>{
removeEventListener('pointermove',mv);removeEventListener('pointerup',up);
if(ghost){ghost.remove();ghost=null;d.classList.remove('lift');slot.classList.remove('hover')}
if(dragging){if(overSlot(ev))attachDisk(d)} /* dropped in bay → boot */
else{attachDisk(d)} /* plain click / tap */
};
addEventListener('pointermove',mv);addEventListener('pointerup',up);
});
});
ej.addEventListener('click',reset);
}

let skTimer=null;
function wireSkills(){
const rot=document.getElementById('skrot'),dots=document.getElementById('skdots'),stageEl=document.getElementById('skstage');
if(!rot)return;
if(skTimer){clearInterval(skTimer);skTimer=null}
rot.innerHTML='';dots.innerHTML='';
let cur=0;const len=SKILLS.length,step=360/len,R=290;
SKILLS.forEach((s,i)=>{
const c=document.createElement('div');c.className='skcard';
c.innerHTML='<span class="feat">● FEATURED</span><div class="sic">'+s.ic+'</div><div class="snm">'+s.n+'</div><div class="sbl"><i></i><i></i><i></i><i></i></div><div class="sled"><i></i><i></i><i></i></div>';
c.addEventListener('click',()=>{if(!skMoved)skGo(i)});

const d=document.createElement('i');d.addEventListener('click',()=>skGo(i));dots.appendChild(d);
});
const cards=[...rot.children];
function lay(){
cards.forEach((c,i)=>{

c.style.transform='translate(-50%,-50%) rotateY('+a+'deg) translateZ('+R+'px)';

});
[...dots.children].forEach((d,k)=>d.classList.toggle('on',k===cur));

document.getElementById('skdesc').textContent=SKILLS[cur].d;
document.getElementById('sktags').innerHTML=SKILLS[cur].t.map(t=>'<span class="tag">'+t+'</span>').join('');
const det=document.getElementById('skdetail');
if(det){det.classList.remove('fadein');void det.offsetWidth;det.classList.add('fadein')}
}
function skGo(i){cur=(i+len)%len;lay()}
document.getElementById('skprev').addEventListener('click',()=>skGo(cur-1));
document.getElementById('sknext').addEventListener('click',()=>skGo(cur+1));
/* swipe with cursor: drag the shelf */
let skMoved=false,skx=0,skdrag=false;
stageEl.addEventListener('pointerdown',e=>{skdrag=true;skMoved=false;skx=e.clientX;rot.classList.add('drag')});
addEventListener('pointerup',e=>{if(!skdrag)return;skdrag=false;rot.classList.remove('drag');const dx=e.clientX-skx;
if(dx<-45)skGo(cur+1);else if(dx>45)skGo(cur-1);setTimeout(()=>skMoved=false,50)});
addEventListener('pointermove',e=>{if(skdrag){const dx=e.clientX-skx;if(Math.abs(dx)>8)skMoved=true;
const off=dx/40;cards.forEach((c,i)=>{const d=(i-cur+len)%len;c.style.transform='translate(-50%,-50%) rotateY('+(d*step+off)+'deg) translateZ('+R+'px)'})}});
/* auto-rotation when idle */
skTimer=setInterval(()=>{if(!document.body.contains(rot)){clearInterval(skTimer);skTimer=null;return}
if(!skdrag)skGo(cur+1)},3800);
skGo(0);
}
